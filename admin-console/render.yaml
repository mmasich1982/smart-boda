services:
  - type: web
    name: smart-boda-admin
    env: node
    nodeVersion: 22.11.0
    plan: free
    # --include=dev is REQUIRED: NODE_ENV=production makes plain `npm install`
    # skip devDependencies, so vite/tailwind are missing and the build fails
    # (leaving a stale committed dist/ to be served).
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://smart-boda-api.onrender.com