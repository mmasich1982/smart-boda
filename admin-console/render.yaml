services:
  - type: web
    name: smart-boda-admin
    env: node
    nodeVersion: 22.11.0
    plan: free
    buildCommand: npm cache clean --force && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VITE_API_BASE_URL
        value: https://smart-boda-api.onrender.com